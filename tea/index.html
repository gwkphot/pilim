<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Чайная — ПИЛИМ И ПИЛИМ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =========================================================
FIXED LOGO
========================================================= -->

<a
    href="../index.html"
    class="logo-fixed"
    aria-label="Пилим и Пилим">

    <img
        decoding="async"
        src="../images/logo.svg"
        alt="Пилим и Пилим">

</a>


<div class="main-stack">


<!-- =========================================================
MANIFEST
========================================================= -->

<section class="stack-card page-manifest">

    <div class="page-manifest-content">

        <h1>

            <span class="manifest-desktop">

                <span class="line">
                    · Чайная
                </span>

                <span class="line">
                    в Пилим и Пилим
                </span>

            </span>

            <span class="manifest-mobile">

                <span class="line">
                    Чайная
                </span>

                <span class="line">
                    · Пилим и Пилим
                </span>

            </span>

        </h1>

    </div>

</section>


<!-- =========================================================
IMAGE
========================================================= -->

<section class="stack-card page-image">

    <picture>

        <source
            media="(max-width:768px)"
            srcset="images/mobile/01.webp">

        <img
            loading="lazy"
            decoding="async"
            src="images/desktop/01.webp"
            alt="Чайная">

    </picture>

</section>


<!-- =========================================================
DESCRIPTION
========================================================= -->

<section class="stack-card page-description">

    <p>
        Пауза — настройка слуха.<br>
        Завариваем, разливаем, молчим.
        Слушаем воду,
        стук пиал, дыхание залива.<br><br>

        Чаем занимается Хранитель пауз.
        Посуда — ручная работа,
        которую можно заполучить.
    </p>

</section>


</div>


<!-- =========================================================
SCRIPT
========================================================= -->

<script src="script.js"></script>

</body>

</html>
